name: 构建并发布 Docker 镜像
run-name: Go 镜像 · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      republish:
        description: 允许覆盖已存在的版本号标签（仅用于重新发布同一版本）
        type: boolean
        default: false

concurrency:
  group: docker-go-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 发布前检查
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: 构建、验证并发布 Go 多架构镜像
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 确定镜像名称
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 读取并校验版本号
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # 版本号是不带前导零的 x.y.z（例如 0.1.0），每次提交把末位加 1
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::package.json 的 version（$version）不是 x.y.z 形式（三段数字，不带前导零，例如 0.1.0），无法作为镜像版本号"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 的版本 v$version 不一致"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # x.y 和 x 两个镜像标签直接由版本号拆出
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "本次发布版本号：v$version"

      - name: 确认版本号未被占用
        env:
          GO_IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.value }}
          REPUBLISH: ${{ github.event.inputs.republish || 'false' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$REPUBLISH" = "true" ]; then
            echo "标签触发或手动重新发布，允许覆盖 $VERSION"
            exit 0
          fi
          if docker buildx imagetools inspect "$GO_IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$GO_IMAGE:$VERSION 已经发布。请先提升 package.json 的 version（当前为 $VERSION），保证每次更新都带新的版本号。"
            exit 1
          fi
          echo "版本号 $VERSION 尚未发布"

      - name: 生成镜像标签和元数据
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=MarkVault Go
            org.opencontainers.image.description=Go 后端、SQLite、本地对象存储与前端静态资源
            org.opencontainers.image.licenses=CC-BY-NC-4.0

      - name: 构建并推送版本镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=markvault-go
          cache-to: type=gha,mode=max,scope=markvault-go
          provenance: mode=max
          sbom: true

      - name: 验证两种架构的 Go 服务和前端
        env:
          GO_IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          trap 'docker rm --force --volumes markvault-go-smoke >/dev/null 2>&1 || true' EXIT
          for architecture in amd64 arm64; do
            echo "验证 linux/$architecture"
            # 多架构索引共用一个摘要，按平台逐个拉取并另打本地标签，
            # 避免 docker 对同一个 digest 引用报 "cannot overwrite digest"。
            docker pull --platform "linux/$architecture" "$GO_IMAGE:$VERSION"
            docker tag "$GO_IMAGE:$VERSION" "markvault-go-smoke:$architecture"
            docker run --detach --name markvault-go-smoke \
              --platform "linux/$architecture" \
              --publish 127.0.0.1:18787:8787 "markvault-go-smoke:$architecture"
            healthy=false
            for attempt in {1..45}; do
              if curl --fail --silent http://127.0.0.1:18787/api/v1/health > /tmp/go-health.json; then
                python3 -c 'import json; data = json.load(open("/tmp/go-health.json"))["data"]; assert data["backend"] == "go" and data["status"] == "ok"'
                curl --fail --silent http://127.0.0.1:18787/ > /tmp/go-index.html
                grep --quiet 'type="module"' /tmp/go-index.html
                docker exec markvault-go-smoke /app/markvault -healthcheck
                healthy=true
                break
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' markvault-go-smoke)" != true ]; then
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              docker logs markvault-go-smoke
              echo "::error::linux/$architecture 镜像未通过健康检查"
              exit 1
            fi
            label_version=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "markvault-go-smoke:$architecture")
            case "$label_version" in
              "$VERSION" | "v$VERSION") ;;
              *)
                echo "::error::镜像版本标签为 $label_version，与期望的 $VERSION 不一致"
                exit 1
                ;;
            esac
            echo "linux/$architecture 通过，镜像版本标签 $label_version"
            docker rm --force --volumes markvault-go-smoke
          done

      - name: 写入构建摘要
        env:
          GO_IMAGE: ${{ steps.image.outputs.name }}
          GO_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo '### Go Docker 镜像发布完成'
            echo ''
            printf -- '- 版本号：`v%s`\n' "$VERSION"
            echo '- 标签：'
            printf -- '  - `%s`\n' $TAGS
            printf -- '- 摘要：`%s`\n' "$GO_DIGEST"
            echo '- 架构：`linux/amd64`、`linux/arm64`'
            echo '- 验证：前端与 Go 检查通过，两种架构均完成服务启动、健康检查、首页检查和镜像版本标签校验。'
            echo '- 下次更新前请先提升 `package.json` 的 `version`，版本号已发布时工作流会拒绝覆盖。'
          } >> "$GITHUB_STEP_SUMMARY"
